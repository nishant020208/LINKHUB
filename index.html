<!doctype html>
<html lang="en" class="dark" style="background-color: #0c0b0a; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Web app manifest: Android/Chrome reads this for installability.
         iOS Safari largely ignores it, which is why the apple-* meta tags below
         carry the standalone behavior on iOS. -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS home screen: apple-touch-icon is what iOS actually uses; the 512px
         maskable icon in the manifest is for Android's adaptive icon shapes and
         is deliberately NOT referenced here. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="76x76" href="/icons/apple-touch-icon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0b0a" />
    <meta name="description" content="UnifyHub - Unified personal command center for Google, Microsoft, and academic accounts." />

    <!-- iOS standalone mode. "black" (not black-translucent) keeps the status bar
         opaque so content is never hidden underneath the notch, and the black
         status bar blends into the #0c0b0a app shell. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="UnifyHub" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="google-site-verification" content="yXAuDy6NgkLKIx6LAoisQf3n0xabppB4xmhWlxlr_M0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <title>UnifyHub | Command Center For Your Day</title>
    <style>
      html, body {
        background-color: #0c0b0a;
        color: #f4efe6;
        margin: 0;
        padding: 0;
      }
      @keyframes unifyhub-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-background text-foreground antialiased min-h-screen" style="background-color: #0c0b0a; color: #f4efe6;">
    <div id="root">
      <div id="unifyhub-preboot-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0c0b0a; color: #f4efe6; font-family: 'Source Sans 3', system-ui, -apple-system, sans-serif;">
        <div style="width: 48px; height: 48px; border-radius: 14px; background: #e8a54b; color: #1a1208; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px; box-shadow: 0 0 28px rgba(232, 165, 75, 0.45); margin-bottom: 20px;">
          U
        </div>
        <div style="width: 26px; height: 26px; border: 2.5px solid rgba(232, 165, 75, 0.2); border-top-color: #e8a54b; border-radius: 50%; animation: unifyhub-spin 0.75s linear infinite; margin-bottom: 14px;"></div>
        <p style="margin: 0; font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: #a89f93; letter-spacing: 0.08em; text-transform: uppercase;">Initializing UnifyHub...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
